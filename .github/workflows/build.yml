name: Build APK

on:
  push:
    branches:
      - claude/mobile-app-plan-1g45r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect & verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "=== Размер ==="
          ls -la "$APK"
          echo "=== Манифест (aapt badging) ==="
          "$BT/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:|launchable-activity:" || true
          echo "=== Подпись (apksigner) ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "=== ИТОГ: APK валиден и подписан ==="

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ChromeFinder-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ChromeFinder-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: ChromeFinder — debug APK (последняя сборка)
          body: |
            Автоматически собранный debug-APK из ветки `claude/mobile-app-plan-1g45r1`.
            Скачай `ChromeFinder-debug.apk` ниже и установи на телефон.
            После установки включи службу спец. возможностей (см. INSTALL.md).
          files: ChromeFinder-debug.apk
